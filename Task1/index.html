<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UFT-8">
        <meta name="viewport" content="width=device-width, instal-scale=1.0"> 
        <title> Task_1</title> 
        <link href="index1.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">       <!--Это сама таблица с ее содержимым -->
            <div class="top-column">    <!--Верхняя часть таблицы, состоит из 3-х колонок  -->
                <div class="top-1-column"></div>    <!--Один верхняя-->
                <div class="top-2-column"></div>  <!-- Два верхняя -->
                 <div class="top-3-column"></div>   <!--Три верхняя-->
            </div>
            <div class="midle-column"> midle <!--Средняя часть таблицы -->
                <div class="midle-1-column">   <!-- Один средняя-->
                    <div class="midle-1_1-column"></div>    <!--Один-один средняя-->
                    <div class="midle-1_2-column"></div>   <!--Один-два средняя -->
                    <div class="midle-1_3-column"></div>  <!-- Один-три средняя -->
                    <div class="midle-1_4-column"></div>  <!-- Один-четыре средняя -->
                </div> 
                <div class="midle-2-column">   <!--Два средняя -->
                    <div class="midle-2_1-column"></div>    <!--Два-один средняя-->
                    <div class="midle-2_2-column"></div>   <!--Два-два средняя -->
                    <div class="midle-2_3-column">  <!-- Два-три средняя -->
                        <div class="table"> </div><!--Тут должна быть таблица в два-три средней -->
                    </div>
                </div>
                <div class="midle-3-column">   <!--Три средняя  --> 
                    <div class="midle-3_1-column"></div>    <!--Три-один средняя-->
                    <div class="midle-3_2-column"></div>    <!--Три-два средняя-->
                </div> 
            </div>   
            <div class="lower-column"> lower  <!--Нижняя часть таблицы -->
                <span class="c-button"></span>    <!--Буква С в кружочке? -->
            </div>
        </div>
    </body>
</html>
